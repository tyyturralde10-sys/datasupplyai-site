<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Ty's DataSupply Dashboard</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{--bg:#0F0F0F;--card:#161616;--ink:#F3F1EE;--muted:#C8C0B5;--muted2:#A8A29C;--line:#2A2A2A;--gold-outline:#B08D57;--gold-grad:linear-gradient(90deg,#D5BC8D 0%,#EAD9B5 48%,#C8A76F 100%);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--muted);font:16px/1.5 "Outfit",system-ui,sans-serif;display:grid;place-items:center;padding:24px}
form{width:min(100%,380px);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:28px;display:grid;gap:14px}
.k{font:500 11px/1 "IBM Plex Mono",monospace;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-outline)}
h1{margin:0;font-size:26px;font-weight:700;letter-spacing:-.03em;color:var(--ink);line-height:1.1}
h1 span{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
label{font-size:14px;color:var(--muted2)}
input[type=password]{width:100%;font:18px "IBM Plex Mono",monospace;background:#0F0F0F;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
input[type=password]:focus{outline:none;border-color:var(--gold-outline)}
button{font:600 16px "Outfit",sans-serif;background:var(--gold-grad);color:#0F0F0F;border:0;border-radius:8px;padding:12px 16px;cursor:pointer}
.remember{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted2)}
.err{font-size:14px;color:#D6C4B3;min-height:1.2em}
</style></head><body>
<form id="f">
  <div class="k">DataSupply · partner workspace</div>
  <h1>Ty's <span>dashboard</span></h1>
  <label for="p">Password</label>
  <input id="p" type="password" autocomplete="current-password" autofocus>
  <label class="remember"><input id="r" type="checkbox" checked> Keep me signed in on this device</label>
  <div class="err" id="e"></div>
  <button type="submit">Open dashboard</button>
</form>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function unlock(pass){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(PAYLOAD.salt),iterations:PAYLOAD.it,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},key,b64(PAYLOAD.ct));
  return new TextDecoder().decode(pt);
}
async function go(pass,remember){
  const html=await unlock(pass);
  try{ if(remember) localStorage.setItem('ds_pass',pass); else localStorage.removeItem('ds_pass'); }catch(e){}
  document.open(); document.write(html); document.close();
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault(); const e=document.getElementById('e'); e.textContent='Opening…';
  try{ await go(document.getElementById('p').value,document.getElementById('r').checked); }
  catch(err){ e.textContent='That password did not work.'; }
});
(async()=>{ try{ const s=localStorage.getItem('ds_pass'); if(s){ document.getElementById('e').textContent='Opening…'; await go(s,true);} }catch(e){ document.getElementById('e').textContent=''; } })();
