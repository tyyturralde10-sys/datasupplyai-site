<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DataSupply · Does your company qualify?</title>
<meta name="description" content="AI labs are paying established companies $100K to $5M for their business data. Answer three questions to see if your company qualifies, or how you can earn from an introduction.">
<meta property="og:title" content="Is your company sitting on $100K to $5M of data?">
<meta property="og:description" content="Three quick questions. See if your company qualifies, or how one introduction could earn you $70,000+.">
<meta property="og:image" content="https://datasupplyai.com.au/start/og.jpg">
<meta property="og:url" content="https://datasupplyai.com.au/start/">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0F0F0F">
<link rel="icon" href="logo-gold.svg">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap">
<!-- META PIXEL: paste the Meta Pixel base code here when you have it. The page calls fbq('track','Lead') on submit if fbq exists. -->
<style>
/* Mobile-first, one question per screen. Desktop just centres the same column. */
:root{--bg:#0F0F0F;--card:#161616;--ink:#F3F1EE;--muted:#C8C0B5;--muted2:#A8A29C;--fine:#8C8781;--line:#2A2A2A;
  --gold1:#D5BC8D;--gold3:#C8A76F;--gold-outline:#B08D57;--champagne:#D6C4B3;
  --gold-grad:linear-gradient(90deg,#D5BC8D 0%,#EAD9B5 48%,#C8A76F 100%);--display:"Outfit",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--muted);font:17px/1.45 var(--display);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background-image:radial-gradient(60% 40% at 50% 0%,rgba(213,188,141,.12),transparent 70%)}
.app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding-top:max(14px,env(safe-area-inset-top,0px));padding-bottom:max(18px,env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;height:44px}
.top img{height:24px;width:auto}
.top .back{background:none;border:0;color:var(--muted2);font:500 14px var(--display);padding:8px 0;cursor:pointer;visibility:hidden}
.top .back.show{visibility:visible}
.bar{height:3px;background:var(--line);border-radius:3px;margin:8px 0 0;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--gold-grad);transition:width .35s ease}
main{flex:1;display:flex;flex-direction:column;justify-content:center;padding-block:22px 10px}
.step{display:none;animation:in .32s ease both}
.step.on{display:block}
@keyframes in{from{opacity:.4;transform:translateY(12px)}to{opacity:1;transform:none}}
.kick{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-outline);margin:0 0 12px}
h1{font-size:clamp(30px,8.5vw,42px);font-weight:800;letter-spacing:-.035em;line-height:1.03;color:var(--ink);margin:0 0 14px;text-wrap:balance}
h1 .g{background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:17px;color:var(--muted);margin:0 0 24px;max-width:36ch}
.opts{display:grid;gap:10px}
.opt{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 18px;font:600 18px/1.2 var(--display);color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;transition:border-color .15s,transform .08s}
.opt small{display:block;font:400 14px/1.3 var(--display);color:var(--muted2);margin-top:3px}
.opt:active{transform:scale(.985)}
.opt:hover,.opt:focus-visible{border-color:var(--gold-outline);outline:none}
.opt.photo{padding:10px 14px 10px 10px;gap:14px;justify-content:flex-start}
.opt.photo img{width:64px;height:64px;border-radius:10px;object-fit:cover;flex:0 0 auto;filter:saturate(.85) brightness(.95)}
.opt.photo .t{flex:1;min-width:0}
.opt .arr{color:var(--gold-outline);font-size:20px;flex:0 0 auto}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;background:var(--gold-grad);color:#0F0F0F;border:0;border-radius:14px;padding:19px 22px;font:700 19px var(--display);cursor:pointer;text-decoration:none;box-shadow:0 0 18px 2px rgba(213,188,141,.28);animation:softglow 3s ease-in-out infinite}
.cta:disabled{opacity:.55;animation:none;box-shadow:none}
@keyframes softglow{0%,100%{box-shadow:0 0 14px 1px rgba(213,188,141,.22)}50%{box-shadow:0 0 28px 6px rgba(213,188,141,.45)}}
.ghost{display:block;text-align:center;margin-top:12px;color:var(--muted2);font-size:15px;text-decoration:none}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:13px;color:var(--muted2)}
.field input{width:100%;font:500 18px var(--display);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 16px}
.field input:focus{outline:none;border-color:var(--gold-outline)}
.field input.bad{border-color:#B08D57;background:#1a1612}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--fine);margin:6px 0 16px}
.consent input{margin-top:3px;accent-color:#D5BC8D}
.stat{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:0 0 22px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:800;letter-spacing:-.03em;color:var(--ink)}
.stat span{font-size:11.5px;color:var(--muted2);line-height:1.2;display:block;margin-top:3px}
.proof{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:0 0 22px}
.proof img{width:46px;height:46px;border-radius:50%;object-fit:cover;flex:0 0 auto}
.proof p{margin:0;font-size:14px;color:var(--muted)}
.proof b{color:var(--ink)}
.labs{margin-top:auto;padding-top:22px;overflow:hidden;position:relative}
.labs p{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fine);margin:0 0 12px;text-align:center}
.labs .track{display:flex;width:max-content;animation:marquee 36s linear infinite}
.labs ul{display:flex;align-items:center;margin:0;padding:0;list-style:none}
.labs li{padding-right:40px}
.labs img{height:20px;width:auto;max-width:110px;display:block;filter:brightness(0) invert(1);opacity:.6}
.labs li.sq img{height:24px}
@keyframes marquee{to{transform:translateX(-50%)}}
.fine{font-size:12px;color:var(--fine);text-align:center;margin:14px 0 0;line-height:1.4}
.big{font-size:clamp(40px,13vw,64px);font-weight:800;letter-spacing:-.045em;line-height:1;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin:0 0 8px}
.err{font-size:14px;color:var(--champagne);min-height:1.2em;margin:0 0 10px}
@media (prefers-reduced-motion:reduce){.step,.cta,.labs .track,.bar i{animation:none;transition:none}}
@media (min-width:720px){body{font-size:18px}.app{max-width:560px}}
</style>
</head>
<body>
<div class="app">
  <div class="top"><button class="back" id="back" type="button">← Back</button><img src="logo-gold.svg" alt="DataSupply"><span style="width:52px"></span></div>
  <div class="bar"><i id="bar"></i></div>
  <main id="main"></main>
  <div class="labs" id="labs"><p>The labs training the next generation of AI</p><div class="track" id="track"></div></div>
  <p class="fine">No offer or payment is guaranteed. Buyers decide eligibility and terms.</p>
</div>
<script src="app.js"></script>
</body>
</html>
